#
# Example bootinfo.conf for the USE_CFILE_DB configuration.
#
# Format of this file is:
#
# IP address	Action
#

# Boot from OS partition
10.0.1.1	part=1

# Boot partition with sysid 131 (Linux)
10.0.1.2	sysid=131

# Boot Linux Recovery MFS
10.0.1.3	mfs=10.11.12.1:/tftpboot/recovery_linux

# Boot FreeBSD Admin MFS
10.0.1.4	mfs=10.11.12.1:/tftpboot/freebsd10-64

# Multi Boot a kernel (extinct)
10.0.1.5	file=10.11.12.1:/tftpboot/netboot
